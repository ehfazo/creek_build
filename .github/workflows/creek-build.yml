name: Creek Build (Self-Hosted)
on: workflow_dispatch

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Env file
        shell: bash
        run: |
          mkdir -p ~/cache
          if [ -f "./build_config.sh" ]; then
              source build_config.sh
          else
              curl -sf https://raw.githubusercontent.com/ehfazo/creek_build/main/config/build_config.sh -o build_config.sh
              source build_config.sh
          fi

      - name: Cache files
        uses: actions/cache@v5.0.5
        with:
          path: ~/cache
          # This creates a unique key for every single run, 
          # but uses the previous run's cache as a starting point.
          key: cache-${{ github.run_id }}
          restore-keys: |
            cache-
      
      - name: Set strict mode
        shell: bash
        run: |
          set -euo pipefail

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install make
        shell: bash
        run: |
          echo "Installing make..."
          sudo apt-get update
          sudo apt-get install -y make git-lfs

      - name: Verify Make Installation
        shell: bash
        run: |
          echo "Verifying make installation..."
          if ! command -v make &> /dev/null; then
            echo "make is not installed. Exiting."
            exit 1
          fi
          echo "make is installed successfully."

      - name: Verify Git LFS Installation
        shell: bash
        run: |
          echo "Verifying Git LFS installation..."
          if ! command -v git-lfs &> /dev/null; then
            echo "Git LFS is not installed. Exiting."
            exit 1
          fi
          echo "Git LFS is installed successfully."


      
      
      - name: Configure Git Authentication
        shell: bash
        run: |
          echo "Configuring Git to use GitHub token for HTTPS clones..."
          # This tells git to transparently use the token for all github.com HTTPS requests
          git config --global url."https://${{ secrets.GITHUB }}@github.com/".insteadOf "https://github.com/"
      
          # 'repo' tool requires a git identity to be set globally
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


      - name: Cleanup Git Authentication
        if: always()
        shell: bash
        run: |
          echo "Cleaning up Git credentials from self-hosted runner..."
          git config --global --unset url."https://${{ secrets.GITHUB }}@github.com/".insteadOf || true

      - name: Install repo tool
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          echo "Installing repo tool..."
          curl -sS https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
      
      - name: Add repo tool to PATH
        shell: bash
        run: |
          echo "Adding repo tool to PATH..."
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify repo tool Installation
        shell: bash
        run: |
          echo "Verifying repo tool installation..."
          if ! command -v repo &> /dev/null; then
            echo "repo tool is not installed. Exiting."
            exit 1
          fi
          echo "repo tool is installed successfully."

      - name: Prepare env file
        shell: bash
        run: |
          cat > .env <<'EOF'
          TG_TOKEN="${{ secrets.TG_TOKEN }}"
          TG_CHAT="${{ secrets.TG_CHAT }}"
          TG_TOPIC="${{ secrets.TG_TOPIC }}"
          UPLOAD="${{ secrets.UPLOAD }}"
          PIXELDRAIN="${{ secrets.PIXELDRAIN }}"
          GITHUB="${{ secrets.GITHUB }}"
          EOF
      
      - name: Check if .env file exists
        shell: bash
        run: |
          if [[ -f ".env" ]]; then
            echo ".env file created successfully."
          else
            echo "Failed to create .env file. Exiting."
            exit 1
          fi

      - name: Load your local secrets
        shell: bash
        run: |
          echo "Loading secrets from .env file..."
          set -o allexport
          source .env
          set +o allexport


      - name: Clean build environment
        shell: bash
        run: |
          echo "Cleaning build environment..."
          # List of folders to remove
          remove=(
              .repo/local_manifests
              out/target/product/${DEVICE}
              hardware/qcom-caf/common/*
              hardware/qcom-caf/sm6225/*
              device/xiaomi/*
              vendor/xiaomi/*
              vendor/lineage-priv/keys
              vendor/qcom/opensource/*
          )

          # Efficiently remove all of them
          for folder in "${remove[@]}"; do
              rm -rf "$folder"
              echo "    Cleaned: $folder"
          done
        
      - name: Repo Init
        shell: bash
        run: |
          echo "Initializing repo..."
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs

      - name: Local Manifests
        shell: bash
        run: |
          echo "Cloning local manifests..."
          git clone https://github.com/nuruszama/crave_build_scripts.git -b lineage-23.2 .repo/local_manifests

      
      - name: Repository Sync
        shell: bash
        run: |
          echo "Starting repo sync..."
          SYNC_START=$(date +%s)
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)
          SYNC_END=$(date +%s)
          SYNC_DIFF=$((SYNC_END - SYNC_START))
          echo "Repo sync completed in $((SYNC_DIFF / 60)) minutes and $((SYNC_DIFF % 60)) seconds."

      - name: Cloning hardware/qcom-caf/common
        shell: bash
        run: |
          echo "Cloning hardware/qcom-caf/common..."
          rm -rf hardware/qcom-caf/common
          git clone https://github.com/sapphire-sm6225/android_hardware_qcom-caf_common.git -b lineage-23.2 hardware/qcom-caf/common

      - name : Lunch device
        shell: bash
        run: |
          echo "Setting up environment variables..."
          source build/envsetup.sh
          lunch ${ROM_NAME}_${DEVICE}-${RELEASE}-${BUILD_TYPE}
          export BUILD_USERNAME=ehfazo
          export BUILD_HOSTNAME=arch
          make installclean

      - name: Bacon
        shell: bash
        run: |
          echo "Starting build process..."
          set -o pipefail
          mka bacon -j$(nproc --all) 2>&1 | tee build.log
          BUILD_LOG="build.log"



          if grep -q -E "ninja failed|failed to build some targets" "$BUILD_LOG"; then
              echo "Build failed. Check the build log for details."
              exit 1
          else
              echo "Build completed successfully."
          fi 
      
      - name: Post-build processing
        shell: bash
        run: | 
          ROM_ZIP=$(ls -t ${OUT_DIR}/*.zip 2>/dev/null | head -n 1)

          if [ -n "$ROM_ZIP" ]; then
              BUILD_ID=$(basename "$ROM_ZIP" .zip)
              ROM_SIZE=$(du -h "$ROM_ZIP" | awk '{print $1}')



      - name: ROM
        shell: bash
        run: |
          UPLOAD_MSG=""
          IMG_MSG=""

          # ROM
          if [ -n "$ROM_ZIP" ]; then
              GO_URL=$(gofile_upload "$ROM_ZIP")
              PD_URL=$(pixeldrain_upload "$ROM_ZIP")

              UPLOAD_MSG="${UPLOAD_MSG}
          ⋄ [GoFile](${GO_URL})
          ⋄ [PixelDrain](${PD_URL})
          "
          fi

          # IMAGES
          for IMG in boot.img vendor_boot.img init_boot.img super_empty.img recovery.img; do
              FILE="${OUT_DIR}/${IMG}"

              if [ -f "$FILE" ]; then
                  GO_URL=$(gofile_upload "$FILE")

                  IMG_MSG="${IMG_MSG}
          ⋄ [${IMG}](${GO_URL})"
              fi
          done

          # OTA
          OTA_JSON="${OUT_DIR}/GMS/${DEVICE}.json"

          if [ -f "$OTA_JSON" ]; then
              GO_URL=$(gofile_upload "$OTA_JSON")

              IMG_MSG="${IMG_MSG}

          ╭─ 📜 JSON
          ⋄ [OTA JSON](${GO_URL})"
          fi

          echo ${UPLOAD_MSG}
          echo "Done"



