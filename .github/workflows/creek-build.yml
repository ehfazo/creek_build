name: Creek Build (Self-Hosted)
on: workflow_dispatch

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440
    # Apply strict mode to EVERY run step by default
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    
    # Map your secrets as environment variables for the whole job
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      PIXELDRAIN: ${{ secrets.PIXELDRAIN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: |
          mkdir -p ~/cache
          
          # Download config if missing
          if [ ! -f "./build_config.sh" ]; then
              curl -sf https://raw.githubusercontent.com/ehfazo/creek_build/main/config/build_config.sh -o build_config.sh
          fi
          
          # 'set -a' automatically exports all variables defined in the sourced script
          set -a
          source build_config.sh
          set +a
          
          # Add '|| true' so grep does not crash the workflow if it fails to find a match
          env | grep -E "^(DEVICE|ROM_NAME|RELEASE|BUILD_TYPE|OUT_DIR)=" >> $GITHUB_ENV || true

      - name: Cache files
        uses: actions/cache@v5.0.5
        with:
          path: ~/cache
          key: cache-${{ github.run_id }}
          restore-keys: |
            cache-

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          echo "Installing make and git-lfs..."
          sudo apt-get update
          sudo apt-get install -y make git-lfs
          
          # Verify installations
          command -v make &> /dev/null || { echo "make failed to install"; exit 1; }
          command -v git-lfs &> /dev/null || { echo "git-lfs failed to install"; exit 1; }

      - name: Configure Git Authentication
        run: |
          echo "Configuring Git to use GitHub token for HTTPS clones..."
          git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cleanup Git Authentication
        if: always()
        run: |
          echo "Cleaning up Git credentials from self-hosted runner..."
          git config --global --unset url."https://${GITHUB_TOKEN}@github.com/".insteadOf || true

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          echo "Installing repo tool..."
          curl -sS https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clean build environment
        run: |
          echo "Cleaning build environment..."
          # Prevent unbound variable errors if DEVICE isn't set yet
          DEVICE_NAME="${DEVICE:-unknown_device}"
          
          remove=(
              .repo/local_manifests
              out/target/product/${DEVICE_NAME}
              hardware/qcom-caf/common/*
              hardware/qcom-caf/sm6225/*
              device/xiaomi/*
              vendor/xiaomi/*
              vendor/lineage-priv/keys
              vendor/qcom/opensource/*
          )

          for folder in "${remove[@]}"; do
              rm -rf "$folder"
              echo "    Cleaned: $folder"
          done
        
      - name: Repo Init
        run: |
          echo "Initializing repo..."
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs

      - name: Local Manifests
        run: |
          echo "Cloning local manifests..."
          git clone https://github.com/nuruszama/crave_build_scripts.git -b lineage-23.2 .repo/local_manifests

      - name: Repository Sync
        run: |
          echo "Starting repo sync..."
          SYNC_START=$(date +%s)
          
          # Retry loop with lower concurrency to prevent HTTP 429 Rate Limits
          until repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j4; do
            echo "Repo sync failed (likely rate-limited). Retrying in 30 seconds..."
            sleep 30
          done
          
          SYNC_END=$(date +%s)
          SYNC_DIFF=$((SYNC_END - SYNC_START))
          echo "Repo sync completed successfully in $((SYNC_DIFF / 60)) minutes and $((SYNC_DIFF % 60)) seconds."

      - name: Cloning hardware/qcom-caf/common
        run: |
          echo "Cloning hardware/qcom-caf/common..."
          rm -rf hardware/qcom-caf/common
          git clone https://github.com/sapphire-sm6225/android_hardware_qcom-caf_common.git -b lineage-23.2 hardware/qcom-caf/common

      - name: Lunch and Build
        run: |
          echo "Setting up environment variables..."
          source build/envsetup.sh
          
          # Variables pulled from GITHUB_ENV
          lunch ${ROM_NAME}_${DEVICE}-${RELEASE}-${BUILD_TYPE}
          export BUILD_USERNAME=ehfazo
          export BUILD_HOSTNAME=arch
          make installclean
          
          echo "Starting build process..."
          mka bacon -j$(nproc --all) 2>&1 | tee build.log

          if grep -q -E "ninja failed|failed to build some targets" build.log; then
              echo "Build failed. Check the build log for details."
              exit 1
          else
              echo "Build completed successfully."
          fi 
      
      - name: Post-build Uploads
        run: | 
          # Source config again to access custom functions like gofile_upload
          source build_config.sh
          
          # If OUT_DIR isn't set by config, fallback to standard Android out path
          TARGET_OUT="${OUT_DIR:-out/target/product/$DEVICE}"
          ROM_ZIP=$(ls -t ${TARGET_OUT}/*.zip 2>/dev/null | head -n 1 || true)
          
          UPLOAD_MSG=""
          IMG_MSG=""

          # ROM Logic (Fixed missing 'fi' statement)
          if [ -n "$ROM_ZIP" ]; then
              BUILD_ID=$(basename "$ROM_ZIP" .zip)
              ROM_SIZE=$(du -h "$ROM_ZIP" | awk '{print $1}')
              
              echo "Uploading ROM..."
              GO_URL=$(gofile_upload "$ROM_ZIP")
              PD_URL=$(pixeldrain_upload "$ROM_ZIP")

              UPLOAD_MSG="${UPLOAD_MSG}
          ⋄ [GoFile](${GO_URL})
          ⋄ [PixelDrain](${PD_URL})
          "
          else
              echo "No ROM zip found to upload."
          fi

          # IMAGES
          for IMG in boot.img vendor_boot.img init_boot.img super_empty.img recovery.img; do
              FILE="${TARGET_OUT}/${IMG}"

              if [ -f "$FILE" ]; then
                  echo "Uploading $IMG..."
                  GO_URL=$(gofile_upload "$FILE")

                  IMG_MSG="${IMG_MSG}
          ⋄ [${IMG}](${GO_URL})"
              fi
          done

          # OTA
          OTA_JSON="${TARGET_OUT}/GMS/${DEVICE}.json"

          if [ -f "$OTA_JSON" ]; then
              echo "Uploading OTA JSON..."
              GO_URL=$(gofile_upload "$OTA_JSON")

              IMG_MSG="${IMG_MSG}

          ╭─ 📜 JSON
          ⋄ [OTA JSON](${GO_URL})"
          fi

          echo -e "$UPLOAD_MSG"
          echo -e "$IMG_MSG"
          echo ${GO_URL}
          echo "Done"
