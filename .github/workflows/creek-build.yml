name: Creek Build (Self-Hosted)
on: workflow_dispatch

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu 24.04 Pro)
        shell: bash
        run: |
          echo "Updating package lists..."
          sudo apt-get update
          
          echo "Installing required dependencies..."
          # Installing git-lfs, make, and OpenJDK 17 (JDK is recommended over JRE for build environments)
          sudo apt-get install -y git-lfs make openjdk-17-jdk
          
          echo "Initializing git-lfs..."
          git lfs install

      - name: Prepare env file
        shell: bash
        run: |
          cat > .env <<'EOF'
          TG_TOKEN="${{ secrets.TG_TOKEN }}"
          TG_CHAT="${{ secrets.TG_CHAT }}"
          TG_TOPIC="${{ secrets.TG_TOPIC }}"
          UPLOAD="${{ secrets.UPLOAD }}"
          PIXELDRAIN="${{ secrets.PIXELDRAIN }}"
          GITHUB="${{ secrets.GITHUB }}"
          EOF

      - name: Configure Git Authentication
        shell: bash
        run: |
          echo "Configuring Git to use GitHub token for HTTPS clones..."
          # This tells git to transparently use the token for all github.com HTTPS requests
          git config --global url."https://${{ secrets.GITHUB }}@github.com/".insteadOf "https://github.com/"
      
          # 'repo' tool requires a git identity to be set globally
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run build
        shell: bash
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          bash ./scripts/gha_preflight.sh
          chmod +x ./run.sh
          ./run.sh

      - name: Cleanup Git Authentication
        if: always()
        shell: bash
        run: |
          echo "Cleaning up Git credentials from self-hosted runner..."
          git config --global --unset url."https://${{ secrets.GITHUB }}@github.com/".insteadOf || true

